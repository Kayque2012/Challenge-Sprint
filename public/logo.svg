<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 50" width="56" height="50"
     fill="none" role="img" aria-label="Dentista na Nuvem">
  <title>Dentista na Nuvem</title>
  <!--
    Cloud horizon mark — a single stroke following the profile of three
    soft cumulus forms seen from below. Reads as: cloud (nuvem), aspiration,
    warmth. Works monochromatic, inverted, embossed.
  -->
  <path
    d="M 4,44 C 7,44 10,22 18,22 C 22,22 22,10 28,10 C 34,10 34,22 38,22 C 46,22 49,44 52,44"
    stroke="#FF8C00"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
